name: Bug report
description: Something behaves differently from what the README says
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: v1.2.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: PHP and Laravel versions
      placeholder: PHP 8.4, Laravel 12.x
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: Quote the README or the docblock you relied on, if there is one.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Include the exact error or the wrong value, not a paraphrase.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Smallest way to reproduce it
      description: A failing test, or the few lines that trigger it.
    validations:
      required: true
