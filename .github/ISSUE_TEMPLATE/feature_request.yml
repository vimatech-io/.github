name: Feature request
description: Propose something the package does not do yet
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem you are solving
      description: Describe the situation, not the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: What you do today instead
      description: If there is no workaround, say so.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like the package to do
    validations:
      required: true
